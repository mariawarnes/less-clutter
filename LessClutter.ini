; Less Clutter - configuration
;
; Mode:
;   Remove = matching items are deleted from the world (disabled + deleted).
;   Fix    = matching items stay, but cannot be picked up, activated, or moved.
; Changes take effect the next time a cell loads (reload your save to be sure).
; Items removed in Remove mode stay removed in existing saves if you switch to Fix.
[General]
Mode=Remove

; EmptyContainers: what to do with empty containers (chests, barrels, sacks,
; urns...), including ones holding only useless items from the lists below, that are NOT in a player home. Off, Remove, or Fix (same meanings
; as Mode above). Containers owned by the player, in a player-owned cell, or
; in a location tagged as a player home (incl. Hearthfire houses) are skipped.
; Containers are judged when they load, so one that a quest or script fills
; later could be caught while empty.
EmptyContainers=Remove

; Debug=1 logs actions taken and describes whatever you look at (crosshair) in
; LessClutter.log, to help work out why an item is or is not being caught.
Debug=0

; Items the player drops or that scripts spawn are never touched.
; Items attached to a quest alias are never touched.

